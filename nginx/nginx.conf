# Temple Application Nginx Reverse Proxy Configuration
# Optimized for Angular Single Page Application and Node.js backend with static uploads

worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Allow up to 25MB file uploads for image receipts / avatars
    client_max_body_size 25M;

    # Gzip compression for high-performance SPA delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    server {
        listen       80;
        server_name  localhost;

        # Angular Production Build Static Directory
        # (Use forward slashes for Windows paths in Nginx)
        root   D:/study/templeApp/ui/dist/ui/browser;
        index  index.html;

        # Angular SPA Routing Fallback
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # IMPORTANT: Use ^~ preferential prefix to prevent static asset regex from intercepting uploads
        location ^~ /uploads/ {
            proxy_pass http://127.0.0.1:5000/uploads/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Reverse Proxy to Node.js Backend API
        location ^~ /api/ {
            proxy_pass http://127.0.0.1:5000/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # Health probe endpoint
        location = /health {
            proxy_pass http://127.0.0.1:5000/health;
            proxy_http_version 1.1;
        }

        # Cache immutable production JS/CSS assets for 30 days
        location ~* \.(?:css|js|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            try_files $uri =404;
        }

        # Custom error page
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
